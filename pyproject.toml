[project]
name = "cache-necromancer"
version = "0.5.1"
description = "Cache death notifier + on-demand revive (/cn:set) via Stop hook + asyncRewake"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "brody424"}]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "freezegun>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["lib*", "scripts*"]
