[project]
name = "cache-necromancer"
version = "0.13.0"
description = "Keeps the prompt cache alive while you are away — wakes the session up to N times per absence (auto_wakes, default 2; /cn:set to override or turn off), timed from the last cache hit by a mod"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "brody424"}]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "freezegun>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["lib*", "scripts*"]
